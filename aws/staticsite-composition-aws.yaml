# AWS S3 edition of the StaticSite Composition (grand finale, deck 08).
#
# The SAME StaticSite XRD (minio/staticsite-xrd.yaml) is reused unchanged. Only
# this Composition is new: it targets real AWS S3 instead of local MinIO. A
# developer who wrote a StaticSite for MinIO gets an identical API here; the
# platform team simply swapped the backend.
#
# Selected by the XR via compositionSelector matchLabels type: aws.
#
# VALIDATE (all against provider-aws-s3, s3.aws.upbound.io/v1beta1):
#   - resource kinds and forProvider field names
#   - bucketSelector.matchControllerRef selection across composed resources
#   - the crossplane.io/external-name annotation as the S3 bucket name
#   - the us-east-1 website endpoint host format
#   - go-templating whitespace/indent (nindent) and multi-document output
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: aws.staticsites.web.example.org
  labels:
    type: aws
spec:
  compositeTypeRef:
    apiVersion: web.example.org/v1alpha1
    kind: StaticSite
  mode: Pipeline
  pipeline:
    # Step 1: the bucket and its public-website settings.
    - step: resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: us-east-1
                  forceDestroy: true
                providerConfigRef:
                  name: default
            patches:
              # siteName becomes the real S3 bucket name (its external name).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.bucketName
              # Publish the public S3 website endpoint on the XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.url
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "http://%s.s3-website-us-east-1.amazonaws.com"
          - name: public-access-block
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  region: us-east-1
                  bucketSelector:
                    matchControllerRef: true
                  blockPublicAcls: false
                  blockPublicPolicy: false
                  ignorePublicAcls: false
                  restrictPublicBuckets: false
                providerConfigRef:
                  name: default
          - name: website
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketWebsiteConfiguration
              spec:
                forProvider:
                  region: us-east-1
                  bucketSelector:
                    matchControllerRef: true
                  indexDocument:
                    - suffix: index.html
                providerConfigRef:
                  name: default

    # Step 2: the public-read policy and one S3 object per page, generated by a
    # go-templating loop over spec.pages, the same pattern as the MinIO edition.
    - step: content
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $site := .observed.composite.resource.spec.siteName }}
            ---
            apiVersion: s3.aws.upbound.io/v1beta1
            kind: BucketPolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                region: us-east-1
                bucketSelector:
                  matchControllerRef: true
                policy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Sid": "PublicReadGetObject",
                        "Effect": "Allow",
                        "Principal": "*",
                        "Action": "s3:GetObject",
                        "Resource": "arn:aws:s3:::{{ $site }}/*"
                      }
                    ]
                  }
              providerConfigRef:
                name: default
            {{- range $page := .observed.composite.resource.spec.pages }}
            ---
            apiVersion: s3.aws.upbound.io/v1beta1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: page-{{ $page.name }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                region: us-east-1
                bucketSelector:
                  matchControllerRef: true
                key: {{ $page.name }}
                contentType: text/html
                content: |
                  {{ $page.content | nindent 18 }}
              providerConfigRef:
                name: default
            {{- end }}
