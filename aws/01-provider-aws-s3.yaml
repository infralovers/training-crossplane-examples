# The Upbound AWS S3 provider (grand finale, deck 08).
# Installs the S3 managed resources (Bucket, BucketPolicy, Object,
# BucketWebsiteConfiguration, BucketPublicAccessBlock) under the
# s3.aws.upbound.io API group. It pulls provider-family-aws as a dependency,
# which supplies the shared ProviderConfig CRD used by 02-providerconfig-aws.yaml.
# Tag: v1.21.1 was never published; v1.23.2 is the newest 1.x and keeps the
# cluster-scoped s3.aws.upbound.io/v1beta1 kinds the cluster-scoped StaticSite composes.
# Pulls anonymously from xpkg.upbound.io (checked 2026-11-05).
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v1.23.2
