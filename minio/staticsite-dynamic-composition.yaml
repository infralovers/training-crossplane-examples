# Dynamic StaticSite Composition (deck 05).
# Same bucket + upload Job as the static version (via patch-and-transform), but
# the page content ConfigMap is now generated by a go-templating loop over
# spec.pages, so a site can have any number of pages, not a fixed two.
# VALIDATE: provider-kubernetes Object apiVersion, template whitespace/indent.
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dynamic.staticsites.web.example.org
  labels:
    type: dynamic
spec:
  compositeTypeRef:
    apiVersion: web.example.org/v1alpha1
    kind: StaticSite
  mode: Pipeline
  pipeline:
    # Step 1: bucket + upload Job, unchanged from the static Composition.
    - step: resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: minio.crossplane.io/v1
              kind: Bucket
              spec:
                forProvider:
                  bucketName: ""
                  region: us-east-1
                  # The upload Job fills this bucket, and MinIO refuses to delete
                  # a non-empty bucket. DeleteAll empties it first so a
                  # `kubectl delete` of the StaticSite tears down cleanly
                  # (mirrors forceDestroy on the AWS edition).
                  bucketDeletionPolicy: DeleteAll
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.bucketName
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.bucketName
                toFieldPath: status.bucketName
          - name: upload
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      namespace: minio
                    spec:
                      backoffLimit: 10
                      template:
                        spec:
                          restartPolicy: OnFailure
                          containers:
                            - name: upload
                              image: minio/mc:latest
                              env:
                                - name: BUCKET
                                  value: ""
                              envFrom:
                                - secretRef:
                                    name: minio-root
                              command:
                                - /bin/sh
                                - -c
                                - |
                                  mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                                  until mc ls "local/$BUCKET" >/dev/null 2>&1; do
                                    echo "waiting for bucket $BUCKET"; sleep 5;
                                  done
                                  for f in /content/*; do
                                    mc cp "$f" "local/$BUCKET/$(basename "$f")";
                                  done
                                  mc anonymous set download "local/$BUCKET"
                                  echo "published site to $BUCKET"
                              volumeMounts:
                                - name: content
                                  mountPath: /content
                          volumes:
                            - name: content
                              configMap:
                                name: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-upload"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.volumes[0].configMap.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-content"

    # Step 2: build the content ConfigMap dynamically, one data key per page.
    - step: content
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: content
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $.observed.composite.resource.spec.siteName }}-content
                    namespace: minio
                  data:
                    {{- range $page := .observed.composite.resource.spec.pages }}
                    {{ $page.name }}: |
                      {{ $page.content | nindent 22 }}
                    {{- end }}
