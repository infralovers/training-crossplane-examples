# Static StaticSite Composition (deck 03).
# Universal composition: one MinIO managed resource (Bucket) plus two native
# Kubernetes objects (a ConfigMap of page content and a Job that uploads it),
# created through provider-kubernetes. The result is a live, in-cluster website.
#
# This static version handles exactly two pages (pages[0] and pages[1]); deck 05
# replaces this step with a go-templating loop over any number of pages.
# VALIDATE: provider-kubernetes Object apiVersion (v1alpha2 here), the mc image,
# and the deep patch field paths against a real cluster.
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: staticsites.web.example.org
  labels:
    type: static
spec:
  compositeTypeRef:
    apiVersion: web.example.org/v1alpha1
    kind: StaticSite
  mode: Pipeline
  pipeline:
    - step: render-site
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # 1. The bucket. Anonymous public-read is set by the upload Job below
          #    (the Bucket resource has no policy field; mc anonymous does it).
          - name: bucket
            base:
              apiVersion: minio.crossplane.io/v1
              kind: Bucket
              spec:
                forProvider:
                  bucketName: ""
                  region: us-east-1
                  # The upload Job fills this bucket, and MinIO refuses to delete
                  # a non-empty bucket. DeleteAll empties it first so a
                  # `kubectl delete` of the StaticSite tears down cleanly
                  # (mirrors forceDestroy on the AWS edition).
                  bucketDeletionPolicy: DeleteAll
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.bucketName
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.bucketName
                toFieldPath: status.bucketName
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.bucketName
                toFieldPath: status.url
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "http://minio.minio.svc.cluster.local:9000/%s/index.html"

          # 2. The page content, as a ConfigMap created via provider-kubernetes.
          - name: content
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: minio
                    data:
                      index.html: ""
                      about.html: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-content"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.pages[0].content
                toFieldPath: spec.forProvider.manifest.data['index.html']
              - type: FromCompositeFieldPath
                fromFieldPath: spec.pages[1].content
                toFieldPath: spec.forProvider.manifest.data['about.html']

          # 3. The upload Job: mounts the ConfigMap and pushes every file to the
          #    bucket with the mc client. Retries until the bucket exists.
          - name: upload
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      namespace: minio
                    spec:
                      backoffLimit: 10
                      template:
                        spec:
                          restartPolicy: OnFailure
                          containers:
                            - name: upload
                              image: minio/mc:latest
                              env:
                                - name: BUCKET
                                  value: ""
                              envFrom:
                                - secretRef:
                                    name: minio-root
                              command:
                                - /bin/sh
                                - -c
                                - |
                                  mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                                  until mc ls "local/$BUCKET" >/dev/null 2>&1; do
                                    echo "waiting for bucket $BUCKET"; sleep 5;
                                  done
                                  for f in /content/*; do
                                    mc cp "$f" "local/$BUCKET/$(basename "$f")";
                                  done
                                  mc anonymous set download "local/$BUCKET"
                                  echo "published site to $BUCKET"
                              volumeMounts:
                                - name: content
                                  mountPath: /content
                          volumes:
                            - name: content
                              configMap:
                                name: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-upload"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.volumes[0].configMap.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-content"
