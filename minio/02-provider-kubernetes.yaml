# provider-kubernetes lets a Composition create native Kubernetes objects
# (ConfigMaps, Jobs, Services) alongside MinIO managed resources. This is what
# makes the "universal composition" StaticSite possible in deck 03.
#
# A DeploymentRuntimeConfig pins the provider's ServiceAccount name so we can
# grant it permissions; the ClusterRoleBinding lets it manage in-cluster objects.
# Package path and tag follow the official crossplane-contrib example.
# cluster-admin is broad (fine for training, tighten for prod).
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.2.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
