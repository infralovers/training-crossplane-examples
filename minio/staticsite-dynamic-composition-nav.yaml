# Dynamic StaticSite Composition, bonus version (deck 05, "Going further").
# Two changes over staticsite-dynamic-composition.yaml:
#   1. The template GENERATES index.html: a <ul> of links built from spec.pages,
#      so navigation is never hand-written. The page-content range skips any
#      page named index.html so it is not emitted twice.
#   2. The upload Job is generated here (not in patch-and-transform) and its name
#      carries a short hash of the pages. Any content change -> new hash -> new
#      Job name -> it re-runs and re-uploads. Crossplane garbage-collects the old
#      (no-longer-desired) Job. The one-shot Job in the base version never re-ran.
# Same metadata.name as the base Composition, so applying this UPDATES the
# dynamic Composition in place. VALIDATE with: crossplane composition render.
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dynamic.staticsites.web.example.org
  labels:
    type: dynamic
spec:
  compositeTypeRef:
    apiVersion: web.example.org/v1alpha1
    kind: StaticSite
  mode: Pipeline
  pipeline:
    # Step 1: the bucket only. It does not depend on page content.
    - step: resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: minio.crossplane.io/v1
              kind: Bucket
              spec:
                forProvider:
                  bucketName: ""
                  region: us-east-1
                  # The upload Job fills this bucket, and MinIO refuses to delete
                  # a non-empty bucket. DeleteAll empties it first so a
                  # `kubectl delete` of the StaticSite tears down cleanly
                  # (mirrors forceDestroy on the AWS edition).
                  bucketDeletionPolicy: DeleteAll
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.siteName
                toFieldPath: spec.forProvider.bucketName
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.bucketName
                toFieldPath: status.bucketName

    # Step 2: generate the content ConfigMap (with a built index) and the upload Job.
    - step: content
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $hash := toJson .observed.composite.resource.spec.pages | sha256sum | trunc 8 }}
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: content
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $.observed.composite.resource.spec.siteName }}-content
                    namespace: minio
                  data:
                    index.html: |
                      <!doctype html><html><body>
                      <h1>{{ $.observed.composite.resource.spec.siteName }}</h1>
                      <ul>
                      {{- range $page := $.observed.composite.resource.spec.pages }}
                      {{- if ne $page.name "index.html" }}
                        <li><a href="{{ $page.name }}">{{ $page.name }}</a></li>
                      {{- end }}
                      {{- end }}
                      </ul></body></html>
                    {{- range $page := $.observed.composite.resource.spec.pages }}
                    {{- if ne $page.name "index.html" }}
                    {{ $page.name }}: |
                      {{ $page.content | nindent 22 }}
                    {{- end }}
                    {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: upload-{{ $hash }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $.observed.composite.resource.spec.siteName }}-upload-{{ $hash }}
                    namespace: minio
                  spec:
                    backoffLimit: 10
                    template:
                      spec:
                        restartPolicy: OnFailure
                        containers:
                          - name: upload
                            image: minio/mc:latest
                            env:
                              - name: BUCKET
                                value: "{{ $.observed.composite.resource.spec.siteName }}"
                            envFrom:
                              - secretRef:
                                  name: minio-root
                            command:
                              - /bin/sh
                              - -c
                              - |
                                mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                                until mc ls "local/$BUCKET" >/dev/null 2>&1; do
                                  echo "waiting for bucket $BUCKET"; sleep 5;
                                done
                                for f in /content/*; do
                                  mc cp "$f" "local/$BUCKET/$(basename "$f")";
                                done
                                mc anonymous set download "local/$BUCKET"
                                echo "published site to $BUCKET"
                            volumeMounts:
                              - name: content
                                mountPath: /content
                        volumes:
                          - name: content
                            configMap:
                              name: {{ $.observed.composite.resource.spec.siteName }}-content
